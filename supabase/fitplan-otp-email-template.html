<div style="font-family:Arial,sans-serif;max-width:520px;margin:auto;padding:28px;color:#17333c">
  <h2 style="font-size:24px;margin-bottom:10px">이메일 인증번호 안내</h2>
  <p>요청하신 이메일 인증번호입니다. 본인이 요청한 것이 아니라면 이 메일을 무시하세요.</p>
  <div style="font-size:34px;letter-spacing:9px;font-weight:800;margin:28px 0;padding:18px;background:#edf7e7;text-align:center;border-radius:12px">{{ .Token }}</div>

  <hr style="border:0;border-top:1px solid #e7eeed;margin:26px 0">
  <p style="font-size:12px;color:#788e90">기존 Magic Link 인증에 익숙하다면 아래 인증 링크로도 계속할 수 있습니다.</p>
  <a href="{{ .ConfirmationURL }}" style="font-size:13px;color:#286847">이메일 인증 링크로 계속하기</a>
</div>
