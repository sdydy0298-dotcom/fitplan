<!-- Supabase shared aleph_common: Authentication > Email Templates > Confirm sign up
     Add {{ .Token }} to the existing confirmation template. Keep .ConfirmationURL
     so other ALEPH apps using link-based signup continue to work. -->
<div style="font-family:Arial,sans-serif;max-width:520px;margin:0 auto;padding:28px;color:#17333c">
 <h2 style="font-size:24px;margin:0 0 12px">이메일 인증번호 안내</h2>
 <p style="font-size:14px;line-height:1.7">요청한 이메일의 소유자 확인을 위한 인증번호입니다. 가입 화면에 아래 숫자를 입력해 주세요.</p>
 <div style="margin:22px 0;background:#f0f9e5;border-radius:12px;text-align:center;padding:21px 12px;font-size:36px;font-weight:800;letter-spacing:8px">{{ .Token }}</div>
 <p style="font-size:12px;color:#688084;line-height:1.6">인증번호는 일회용이며 유효 시간과 재발송 횟수는 인증 서버 설정을 따릅니다.</p>
 <p style="font-size:12px;color:#688084">본인이 요청한 가입이 아니라면 이 메일을 무시하세요.</p>
 <hr style="border:none;border-top:1px solid #dae5e0;margin:25px 0"/>
 <p style="font-size:12px;color:#688084">기존 서비스처럼 링크로 인증하려면 아래 링크를 이용할 수도 있습니다.</p>
 <a href="{{ .ConfirmationURL }}" style="font-size:13px;color:#2e7657">이메일 인증 링크로 계속하기</a>
</div>
